packages:
  - packages/*

preferWorkspacePackages: true

# pnpm 11/12 no longer reads the "resolutions" field from package.json; the
# canonical location is "overrides" in pnpm-workspace.yaml. These are carried
# over from the old package.json resolutions so resolution does not regress
# (notably node-gyp, an optional dep of sqlite3, was dropping from ^10 to 8).
overrides:
  '@types/eslint': ^9.0.0
  jsonld: npm:@digitalcredentials/jsonld@^6.0.0
  # Ticket 10c: the RN harness (packages/test-rn-app) measures the upstream
  # digitalbazaar stack next to the DCC one, so the upstream packages must get
  # upstream jsonld, not the DCC fork the global override above forces.
  '@digitalbazaar/vc>jsonld': 9.0.0
  'jsonld-signatures>jsonld': 9.0.0
  node-gyp: ^10.0.0

# pnpm 11/12 replaced onlyBuiltDependencies / ignoredBuiltDependencies with a
# single allowBuilds map. true => run build scripts, false => skip them.
# strictDepBuilds (default true) errors on any package with a build script that
# is not listed here, so every package that has one must be covered.
allowBuilds:
  sqlite3: true
  '@scarf/scarf': false
  bufferutil: false
  core-js: false
  core-js-pure: false
  nx: false
  secp256k1: false
  utf-8-validate: false
  esbuild: false

# pnpm 11.25/12 added blockExoticSubdeps (default true), which rejects
# git/tarball-resolved dependencies in sub-dependency position. This project has
# a git-hosted dep (@veramo-community/lds-ecdsa-secp256k1-recovery2020 ->
# uport-project/EcdsaSecp256k1RecoverySignature2020) that is not on npm, so we
# restore the pre-11 behavior of allowing it.
blockExoticSubdeps: false
