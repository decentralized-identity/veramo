name: build-test-publish-on-push-cached
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      preid:
        description: 'npm dist-tag for snapshot pre-releases (used when not on main)'
        type: choice
        default: next
        options:
          - next
          - unstable
      ref:
        description: 'Optional git ref to build and release from (defaults to the selected branch)'
        required: false
        type: string
  push:
    branches:
      - 'main'
      - 'next'
      - 'unstable'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
      - name: 'Setup Node.js with pnpm cache'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm build
      - name: 'Save build output'
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: '${{ github.workspace }}'
          key: '${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}'

  test-integration:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [ 1, 2, 3, 4, 5 ]
    services:
      postgres:
        image: postgres:16.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test123
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
      - name: 'Restore build output'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: '${{ github.workspace }}'
          key: '${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}'
          restore-keys: '${{ runner.os }}-build-${{ github.sha }}'
          fail-on-cache-miss: true
      - name: 'Setup Node.js with pnpm cache'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm rebuild -r
      - name: 'Run integration tests'
        env:
          INCLUDE_POSTGRES_TESTS: true
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test123
          POSTGRES_PORT: 5432
        run: pnpm test:integration --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - run: mv coverage/coverage-final.json coverage/${{matrix.shard}}.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-artifacts-${{ matrix.shard }}
          path: coverage/

  report-coverage:
    runs-on: ubuntu-latest
    needs: [ test-integration ]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-artifacts-*
          merge-multiple: true
          path: coverage
      - name: Merge Code Coverage
        run: npx nyc merge coverage/ coverage/coverage-final.json
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos but sometimes fails without :|
          fail_ci_if_error: false

  test-browser:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
      - name: 'Restore build output'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: '${{ github.workspace }}'
          key: '${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}'
          restore-keys: '${{ runner.os }}-build-${{ github.sha }}'
          fail-on-cache-miss: true
      - name: 'Setup Node.js with pnpm cache'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm rebuild -r
      - name: 'Install Playwright chromium browser'
        run: pnpm --filter @veramo/test-react-app exec playwright install --with-deps chromium
      - name: 'Run browser tests'
        run: pnpm test:browser

  lint-and-docs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
      - name: 'Restore build output'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: '${{ github.workspace }}'
          key: '${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}'
          restore-keys: '${{ runner.os }}-build-${{ github.sha }}'
          fail-on-cache-miss: true
      - name: 'Setup Node.js with pnpm cache'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm run lint
      - run: pnpm run docs

  publish:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    needs:
      - build
      - test-integration
      - test-browser
      - lint-and-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
      - name: 'Setup Node.js'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Creates/updates a "chore(release): version packages" PR when there are
      # pending changesets; publishes @latest, pushes git tags and creates
      # GitHub releases when the version-packages PR is merged.
      - name: 'Create release PR or publish @latest when on main'
        if: github.ref == 'refs/heads/main'
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          github-token: ${{ github.token }}
          publish-script: 'pnpm run release:publish'

      # Snapshot (canary-style) pre-release: publishes ALL packages in lockstep
      # at '<next-version>-<preid>-<datetime>' under the given dist-tag, without
      # git tags or version commits. Requires at least one pending changeset.
      # PREID is passed via env (not direct interpolation) to avoid shell
      # template injection from branch/tag names or the dispatch input.
      - name: 'Publish snapshot pre-release when not on main'
        if: github.ref != 'refs/heads/main'
        env:
          PREID: ${{ inputs.preid || github.ref_name }}
        run: pnpm run release:snapshot "$PREID"
